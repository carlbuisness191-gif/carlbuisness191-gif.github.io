<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DogWeb Browser</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fira+Code:wght@400;500&display=swap');
:root{--golden:#F4A340;--bark:#8B4513;--cream:#FFF8F0;--grass:#4CAF50;--dark:#2C1810;--tab-bg:#E8D5C0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:#C8A882;height:100vh;overflow:hidden;display:flex;flex-direction:column;}

/* TITLE BAR */
#title-bar{background:linear-gradient(135deg,#5C3317,#8B4513,#A0522D);padding:4px 10px;display:flex;align-items:center;gap:10px;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,.35);flex-shrink:0;}
.tl-group{display:flex;gap:5px;}
.tl{width:10px;height:10px;border-radius:50%;}
.tl.r{background:#FF5F57;}.tl.y{background:#FFBD2E;}.tl.g{background:#28CA42;}
#browser-title{color:#FFF8F0;font-size:10px;font-weight:700;flex:1;text-align:center;}
#user-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border-radius:20px;padding:2px 8px;cursor:pointer;transition:background .15s;}
#user-pill:hover{background:rgba(255,255,255,.28);}
#user-pill span{color:#FFF8F0;font-size:10px;font-weight:700;}

/* TAB BAR */
#tab-bar{background:linear-gradient(to bottom,#A07050,#8B6040);display:flex;align-items:flex-end;padding:4px 6px 0;gap:2px;min-height:32px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex-shrink:0;}
#tab-bar::-webkit-scrollbar{display:none;}
.tab{background:var(--tab-bg);border-radius:8px 8px 0 0;padding:4px 8px 4px 8px;font-size:10px;font-weight:700;color:#5C3317;cursor:pointer;display:flex;align-items:center;gap:5px;min-width:90px;max-width:160px;white-space:nowrap;overflow:hidden;flex-shrink:0;border:1px solid rgba(0,0,0,.12);border-bottom:none;transition:background .15s;}
.tab.active{background:var(--cream);color:#2C1810;}
.tab-icon{font-size:13px;flex-shrink:0;}
.tab-lbl{overflow:hidden;text-overflow:ellipsis;flex:1;}
.tab-x{opacity:.4;font-size:15px;flex-shrink:0;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;transition:opacity .15s,background .15s;line-height:1;}
.tab-x:hover{opacity:1;background:rgba(0,0,0,.18);}
#plus-tab{background:rgba(255,255,255,.18);border:none;border-radius:6px 6px 0 0;width:26px;height:24px;cursor:pointer;font-size:17px;color:#FFF8F0;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;line-height:1;}
#plus-tab:hover{background:rgba(255,255,255,.32);}

/* TOOLBAR */
#toolbar{background:var(--cream);padding:5px 10px;display:flex;align-items:center;gap:6px;border-bottom:2px solid #D4AA7D;box-shadow:0 2px 4px rgba(0,0,0,.07);flex-shrink:0;}
.nbtn{background:none;border:1px solid transparent;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;color:#8B4513;transition:background .15s,border-color .15s;flex-shrink:0;}
.nbtn:hover{background:rgba(139,69,19,.1);border-color:#D4AA7D;}
#abar-wrap{flex:1;display:flex;align-items:center;background:white;border:2px solid #D4AA7D;border-radius:20px;padding:0 8px;gap:5px;transition:border-color .2s,box-shadow .2s;}
#abar-wrap:focus-within{border-color:var(--golden);box-shadow:0 0 0 3px rgba(244,163,64,.2);}
#abar{flex:1;border:none;outline:none;font-family:'Fira Code',monospace;font-size:12px;color:#2C1810;background:transparent;padding:3px 0;}
#go-btn{background:var(--golden);border:none;border-radius:14px;padding:3px 11px;font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;color:white;cursor:pointer;flex-shrink:0;transition:background .15s;}
#go-btn:hover{background:#D08010;}
#dev-btn{background:#2C1810;color:var(--golden);border:none;border-radius:6px;padding:4px 9px;font-family:'Nunito',sans-serif;font-weight:800;font-size:10px;cursor:pointer;flex-shrink:0;white-space:nowrap;transition:background .15s;}
#dev-btn:hover{background:#4A2518;}

/* CONTENT */
#content-area{flex:1;position:relative;overflow:hidden;background:var(--cream);}
.tab-pane{position:absolute;inset:0;width:100%;height:100%;display:none;overflow:hidden;}
.tab-pane.active{display:block;}

/* NEW TAB */
.nt-page{width:100%;height:100%;overflow-y:auto;background:linear-gradient(145deg,#FFF8F0,#FFE8CC,#FFD4A0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;}
@keyframes wag{0%{transform:rotate(-6deg) scale(.85);opacity:0}60%{transform:rotate(7deg) scale(1.05)}100%{transform:rotate(0) scale(1);opacity:1}}
.nt-logo{text-align:center;animation:wag .5s ease-out;}
.nt-dog{font-size:42px;}
.nt-title{font-size:32px;font-weight:900;color:#5C3317;letter-spacing:-1px;}
.nt-title b{color:var(--golden);}
.nt-sub{color:#A07050;font-size:11px;font-weight:600;margin-top:3px;}
.nt-sbar{display:flex;width:min(420px,90%);background:white;border-radius:26px;border:2px solid #D4AA7D;overflow:hidden;box-shadow:0 4px 18px rgba(139,69,19,.14);}
.nt-sbar input{flex:1;border:none;outline:none;padding:9px 14px;font-family:'Nunito',sans-serif;font-size:13px;background:transparent;color:#2C1810;}
.nt-sbar button{background:var(--golden);border:none;padding:9px 16px;font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;color:white;cursor:pointer;}
.nt-sbar button:hover{background:#D08010;}
.nt-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.abtn{background:white;border:2px solid #D4AA7D;border-radius:10px;padding:6px 12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;color:#8B4513;cursor:pointer;transition:background .15s,transform .1s;display:flex;align-items:center;gap:5px;}
.abtn:hover{background:#FFF0DC;transform:translateY(-1px);}
.nt-sites{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:600px;}
.scrd{background:white;border-radius:12px;padding:10px 12px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(139,69,19,.09);border:1px solid #E8D5C0;transition:transform .15s,box-shadow .15s;min-width:90px;}
.scrd:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(139,69,19,.18);}
.scrd-icon{font-size:20px;}
.scrd-name{font-size:10px;font-weight:700;color:#8B4513;margin-top:3px;}

/* BUILTIN PAGES */
.bp{width:100%;height:100%;overflow-y:auto;background:var(--cream);}
.srp{padding:18px 24px;font-family:'Nunito',sans-serif;max-width:780px;margin:0 auto;}
.srp-hdr{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.srp-hdr h2{font-size:16px;color:#5C3317;font-weight:900;}
.srp-hdr small{color:#A07050;font-size:13px;}
.rc{background:white;border:1px solid #E8D5C0;border-radius:12px;padding:15px 18px;margin-bottom:9px;cursor:pointer;transition:box-shadow .15s,border-color .15s;}
.rc:hover{box-shadow:0 4px 12px rgba(139,69,19,.1);border-color:var(--golden);}
.rc-dom{font-size:10px;color:var(--grass);font-weight:700;margin-bottom:3px;font-family:'Fira Code',monospace;}
.rc-ttl{font-size:11px;font-weight:800;color:#2C1810;margin-bottom:3px;}
.rc-dsc{font-size:11px;color:#7A6050;line-height:1.4;}
.no-res{text-align:center;padding:60px 20px;color:#A07050;font-size:15px;}
.no-res .ni{font-size:48px;margin-bottom:9px;}
.asp{padding:18px 24px;font-family:'Nunito',sans-serif;}
.asp h2{font-size:18px;font-weight:900;color:#5C3317;margin-bottom:18px;}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px;}
.sgc{background:white;border:1px solid #E8D5C0;border-radius:12px;padding:12px;cursor:pointer;text-align:center;transition:box-shadow .15s,transform .15s;}
.sgc:hover{box-shadow:0 4px 14px rgba(139,69,19,.12);transform:translateY(-2px);}
.sgc-icon{font-size:24px;margin-bottom:5px;}
.sgc-name{font-size:11px;font-weight:800;color:#2C1810;}
.sgc-dom{font-size:10px;color:var(--grass);font-family:'Fira Code',monospace;margin-top:1px;}
.adp{padding:18px 24px;font-family:'Nunito',sans-serif;max-width:740px;margin:0 auto;}
.adp h2{font-size:24px;font-weight:900;color:#5C3317;margin-bottom:6px;}
.badge{display:inline-block;background:var(--grass);color:white;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:middle;}
.adp h3{font-size:15px;font-weight:800;color:#8B4513;margin:18px 0 8px;}
.adp p{color:#6A5040;font-size:13px;line-height:1.6;margin-bottom:8px;}
.acode{background:#1A0A04;color:#E8D5B0;border-radius:8px;padding:14px;font-family:'Fira Code',monospace;font-size:12px;line-height:1.7;overflow-x:auto;margin-bottom:9px;border:1px solid #3A2010;}
.acode .kw{color:#FF9A5C;}.acode .st{color:#A8D8A0;}.acode .fn{color:#87CEEB;}.acode .cm{color:#7A6050;}

/* NOT FOUND */
.nfw{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--cream);}
.nfb{text-align:center;font-family:'Nunito',sans-serif;padding:40px;}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.nf-icon{font-size:52px;display:block;margin-bottom:10px;animation:shake .5s ease;}
.nfb h2{font-size:18px;font-weight:900;color:#5C3317;margin-bottom:8px;}
.nfb p{color:#A07050;font-size:13px;max-width:320px;line-height:1.6;margin:0 auto 16px;}
.nf-btn{background:var(--golden);border:none;border-radius:10px;color:white;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;padding:9px 22px;cursor:pointer;margin:0 4px;}
.nf-btn.dk{background:#2C1810;}

/* STATUS */
#status-bar{background:#5C3317;padding:1px 10px;display:flex;align-items:center;gap:10px;font-size:10px;color:#C8A882;font-family:'Fira Code',monospace;flex-shrink:0;}
.dot{width:7px;height:7px;border-radius:50%;background:#4CAF50;display:inline-block;margin-right:3px;}

/* AUTH MODAL */
#auth-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:3000;align-items:center;justify-content:center;}
#auth-modal.open{display:flex;}
.auth-box{background:linear-gradient(145deg,#2C1810,#3A1808);border-radius:18px;padding:24px;width:320px;box-shadow:0 24px 60px rgba(0,0,0,.6);border:1px solid #5C3317;font-family:'Nunito',sans-serif;}
.auth-dog{font-size:40px;text-align:center;margin-bottom:6px;animation:wag .5s ease-out;}
.auth-title{font-size:18px;font-weight:900;color:var(--golden);text-align:center;margin-bottom:4px;}
.auth-sub{font-size:11px;color:#A07050;text-align:center;margin-bottom:16px;}
.auth-tabs{display:flex;margin-bottom:20px;border-radius:8px;overflow:hidden;border:1px solid #5C3317;}
.atab{flex:1;padding:8px;text-align:center;font-weight:800;font-size:13px;cursor:pointer;color:#A07050;background:none;border:none;font-family:'Nunito',sans-serif;transition:background .15s,color .15s;}
.atab.on{background:var(--golden);color:#1E0F08;}
.af{margin-bottom:13px;}
.af label{display:block;color:#C8A882;font-size:10px;font-weight:700;margin-bottom:4px;}
.af input{width:100%;background:#1E0F08;border:1px solid #4A2518;border-radius:8px;color:#E8D5B0;font-family:'Nunito',sans-serif;font-size:14px;padding:9px 12px;outline:none;transition:border-color .15s;}
.af input:focus{border-color:var(--golden);}
#auth-err{color:#FF7070;font-size:12px;font-weight:700;margin-bottom:10px;min-height:16px;text-align:center;}
#auth-ok{width:100%;background:var(--golden);border:none;border-radius:10px;color:#1E0F08;font-family:'Nunito',sans-serif;font-weight:900;font-size:15px;padding:11px;cursor:pointer;transition:background .15s;}
#auth-ok:hover{background:#D08010;}
#auth-ok:disabled{background:#A07050;cursor:default;}

/* DEV MODAL */
#dev-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;}
#dev-modal.open{display:flex;}
.dw{background:#1E0F08;border-radius:14px;width:min(880px,96vw);height:min(600px,93vh);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.65);border:1px solid #3A2010;}
.dtb{background:linear-gradient(135deg,#3A1808,#5C2810);padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.dtb h3{color:var(--golden);font-size:12px;font-weight:900;flex:1;}
.dtb .du{color:#C8A882;font-size:10px;font-weight:700;background:rgba(255,255,255,.08);padding:3px 10px;border-radius:20px;}
.dx{background:none;border:none;color:#A07050;font-size:18px;cursor:pointer;padding:2px 6px;border-radius:4px;transition:color .15s;}
.dx:hover{color:white;}
.dbody{display:flex;flex:1;overflow:hidden;}
.dsb{width:175px;background:#150904;border-right:1px solid #3A2010;display:flex;flex-direction:column;flex-shrink:0;}
.dsb-title{padding:7px 10px;font-size:9px;font-weight:800;color:#8B6040;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #2A1008;}
#site-list{flex:1;overflow-y:auto;}
.sli{padding:7px 10px;font-size:10px;font-weight:700;color:#C8A882;cursor:pointer;transition:background .1s;display:flex;align-items:center;gap:6px;border-bottom:1px solid #1E0F08;overflow:hidden;}
.sli:hover{background:#2C1810;}
.sli.on{background:#3A1808;color:var(--golden);}
.pdot{margin-left:auto;color:#4CAF50;font-size:10px;flex-shrink:0;}
.dsb-acts{padding:6px;border-top:1px solid #2A1008;display:flex;flex-direction:column;gap:5px;}
.da{background:none;border:1px solid #4A2518;border-radius:6px;color:#C8A882;font-family:'Nunito',sans-serif;font-size:10px;font-weight:700;padding:5px;cursor:pointer;transition:background .1s,border-color .1s;text-align:center;width:100%;}
.da:hover{background:#2C1810;border-color:var(--golden);color:var(--golden);}
.da.pr{background:var(--golden);border-color:var(--golden);color:#1E0F08;}
.da.pr:hover{background:#D08010;}
.da.dr{border-color:#8B0000;color:#FF6B6B;}
.da.dr:hover{background:#3A0808;}
.dea{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.sib{background:#2C1810;padding:5px 10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #3A2010;flex-shrink:0;flex-wrap:wrap;}
.sib label{color:#8B6040;font-size:10px;font-weight:700;}
.sib input{background:#1E0F08;border:1px solid #4A2518;border-radius:5px;color:#E8D5B0;font-size:12px;padding:4px 7px;outline:none;transition:border-color .15s;}
.sib input:focus{border-color:var(--golden);}
#cur-dom{color:var(--golden);font-family:'Fira Code',monospace;font-size:12px;}
#file-tabs{background:#1E0F08;display:flex;align-items:flex-end;padding:4px 4px 0;gap:2px;border-bottom:1px solid #3A2010;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
#file-tabs::-webkit-scrollbar{display:none;}
.ftab{padding:3px 8px;font-size:10px;font-weight:700;color:#8B6040;cursor:pointer;border-radius:5px 5px 0 0;background:#150904;border:1px solid #2A1008;border-bottom:none;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:background .1s,color .1s;}
.ftab.on{background:#2C1810;color:var(--golden);border-color:#4A2518;}
.fx{opacity:.45;font-size:12px;line-height:1;}
.fx:hover{opacity:1;}
#add-file{background:none;border:none;color:#8B6040;font-size:20px;cursor:pointer;padding:3px 8px;border-radius:4px;transition:color .1s;flex-shrink:0;line-height:1;}
#add-file:hover{color:var(--golden);}
.editor-wrap{flex:1;position:relative;overflow:hidden;}
#editor{width:100%;height:100%;background:#1A0A04;color:#E8D5B0;border:none;outline:none;font-family:'Fira Code',monospace;font-size:13px;line-height:1.6;padding:14px;resize:none;tab-size:2;}
.etb{background:#150904;padding:5px 10px;display:flex;align-items:center;gap:6px;border-top:1px solid #2A1008;flex-shrink:0;}
.etb label{color:#8B6040;font-size:10px;font-weight:700;}
.etb select{background:#2C1810;color:#C8A882;border:1px solid #4A2518;border-radius:4px;padding:4px 7px;font-family:'Nunito',sans-serif;font-size:11px;}
.sbtn{background:#4A2598;border:none;border-radius:6px;color:white;font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;padding:4px 10px;cursor:pointer;transition:background .15s;}
.sbtn:hover{background:#6A45B8;}
.lbtn{background:var(--grass);border:none;border-radius:6px;color:white;font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;padding:4px 10px;cursor:pointer;margin-left:auto;transition:background .15s;}
.lbtn:hover{background:#3A9A3A;}
#prev-frame{width:100%;height:100%;border:none;display:none;}
#prev-frame.on{display:block;}

/* NEW SITE */
#ns-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;align-items:center;justify-content:center;}
#ns-modal.open{display:flex;}
.nsb{background:#2C1810;border-radius:14px;padding:20px;width:340px;box-shadow:0 20px 50px rgba(0,0,0,.5);border:1px solid #5C3317;font-family:'Nunito',sans-serif;}
.nsb h3{color:var(--golden);font-size:15px;font-weight:900;margin-bottom:9px;}
.nf2{margin-bottom:9px;}
.nf2 label{display:block;color:#C8A882;font-size:10px;font-weight:700;margin-bottom:4px;}
.nf2 input,.nf2 select{width:100%;background:#1E0F08;border:1px solid #4A2518;border-radius:7px;color:#E8D5B0;font-family:'Fira Code',monospace;font-size:13px;padding:8px 10px;outline:none;transition:border-color .15s;}
.nf2 input:focus,.nf2 select:focus{border-color:var(--golden);}
.ns-acts{display:flex;gap:8px;margin-top:16px;}
.ns-can{flex:1;background:none;border:1px solid #4A2518;border-radius:7px;color:#C8A882;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;padding:9px;cursor:pointer;}
.ns-can:hover{background:#3A1808;}
.ns-ok{flex:2;background:var(--golden);border:none;border-radius:7px;color:#1E0F08;font-family:'Nunito',sans-serif;font-weight:900;font-size:13px;padding:9px;cursor:pointer;}
.ns-ok:hover{background:#D08010;}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:#2C1810;color:#FFF8F0;border:1px solid var(--golden);border-radius:10px;padding:7px 16px;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;z-index:9999;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- TITLE BAR -->
<div id="title-bar">
  <div class="tl-group"><div class="tl r"></div><div class="tl y"></div><div class="tl g"></div></div>
  <div id="browser-title">🐾 DogWeb — The .dog Internet</div>
  <div id="user-pill"><span>🐶</span><span id="upill-lbl">Sign In</span></div>
</div>

<!-- TAB BAR -->
<div id="tab-bar">
  <button id="plus-tab">+</button>
</div>

<!-- TOOLBAR -->
<div id="toolbar">
  <button class="nbtn" id="btn-back">←</button>
  <button class="nbtn" id="btn-fwd">→</button>
  <button class="nbtn" id="btn-reload">↻</button>
  <button class="nbtn" id="btn-home">🏠</button>
  <div id="abar-wrap">
    <span id="lock-icon">🔒</span>
    <input id="abar" type="text" spellcheck="false" placeholder="Search DogWeb or type a .dog address…">
    <button id="go-btn">Go →</button>
  </div>
  <button id="dev-btn">⚙️ Dev Tools</button>
</div>

<!-- CONTENT -->
<div id="content-area"></div>

<!-- STATUS -->
<div id="status-bar">
  <span id="status-msg">DogWeb ready 🐾</span>
</div>

<!-- AUTH MODAL -->
<div id="auth-modal">
  <div class="auth-box">
    <div class="auth-dog">🐶</div>
    <div class="auth-title">DogWeb Account</div>
    <div class="auth-sub">Sign in to build &amp; publish .dog sites</div>
    <div class="auth-tabs">
      <button class="atab on" id="tab-login">Sign In</button>
      <button class="atab" id="tab-signup">Sign Up</button>
    </div>
    <div class="af"><label>Username</label><input type="text" id="au" placeholder="myusername" autocomplete="username"></div>
    <div class="af"><label>Password</label><input type="password" id="ap" placeholder="••••••••" autocomplete="current-password"></div>
    <div id="auth-err"></div>
    <button id="auth-ok">Sign In 🐾</button>
  </div>
</div>

<!-- DEV MODAL -->
<div id="dev-modal">
  <div class="dw">

async function sha256(str){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

function openAuth(mode){
  mode = mode||'login'; authMode = mode;
  $id('tab-login').classList.toggle('on', mode==='login');
  $id('tab-signup').classList.toggle('on', mode==='signup');
  $id('auth-ok').textContent = mode==='login' ? 'Sign In 🐾' : 'Create Account 🐾';
  $id('auth-err').textContent = '';
  $id('au').value = ''; $id('ap').value = '';
  $id('auth-modal').classList.add('open');
  setTimeout(()=>$id('au').focus(),80);
}

function switchAuthMode(mode){

async function doAuth(){
  const u = $id('au').value.trim().toLowerCase();
  const p = $id('ap').value;
  const errEl = $id('auth-err');
  const btn   = $id('auth-ok');
  errEl.textContent='';
  if(!u){ errEl.textContent='Enter a username.'; return; }
  if(u.length<3){ errEl.textContent='Username needs 3+ chars.'; return; }
  if(!p){ errEl.textContent='Enter a password.'; return; }
  if(p.length<6){ errEl.textContent='Password needs 6+ chars.'; return; }
  btn.disabled=true; btn.textContent='Working…';
  try{
    const hash = await sha256(p);
    const ref  = FS.collection('dogweb_users').doc(u);
    if(authMode==='signup'){
      const snap = await ref.get();
      if(snap.exists){ errEl.textContent='Username taken!'; btn.disabled=false; btn.textContent='Create Account 🐾'; return; }
      await ref.set({ username:u, passwordHash:hash, createdAt:firebase.firestore.FieldValue.serverTimestamp() });
      me = { username:u };
    } else {
      const snap = await ref.get();
      if(!snap.exists){ errEl.textContent='No account with that username.'; btn.disabled=false; btn.textContent='Sign In 🐾'; return; }
      if(snap.data().passwordHash!==hash){ errEl.textContent='Wrong password.'; btn.disabled=false; btn.textContent='Sign In 🐾'; return; }
      me = { username:u };
    }
    saveSession(); refreshUserUI(); closeAuth();
    await loadMySites();
    toast('🐾 Welcome, @'+me.username+'!');
  } catch(e){
    console.error(e);
    errEl.textContent='Error: '+e.message;
    btn.disabled=false;
    btn.textContent = authMode==='login' ? 'Sign In 🐾' : 'Create Account 🐾';
  }
}

const BUILTINS = {
  doggle:  { title:'Doggle Search',  favicon:'🔍', desc:'The #1 search engine on DogWeb' },
  sites:   { title:'All Sites',      favicon:'📋', desc:'Browse all .dog sites' },

// ═══════════════════════════════════════════════════════════
// TABS  — each tab owns a .tab-pane div in #content-area
// ═══════════════════════════════════════════════════════════
let tabs = [];
let activeId = null;

function mkTab(url, title, favicon){
  url    = url    || 'dogweb://newtab';
  title  = title  || 'New Tab';
  favicon= favicon|| '🐾';
  const id = 't'+Date.now()+Math.random().toString(36).slice(2,6);
  const pane = document.createElement('div');
  pane.className = 'tab-pane';
  pane.id = 'pane_'+id;
  $id('content-area').appendChild(pane);
  const tab = { id, url, title, favicon, back:[], fwd:[], pane };
  tabs.push(tab);
  renderTabs();
  activateTab(id);
  loadURL(id, url, false);
  return id;
}

function activateTab(id){
  if(activeId===id) return;
  activeId = id;
  tabs.forEach(t => t.pane.classList.toggle('active', t.id===id));
  const tab = getTab(id);
  if(tab){
    $id('abar').value = (tab.url==='dogweb://newtab'||!tab.url) ? '' : tab.url;
    $id('status-msg').textContent = tab.url||'New Tab';
  }
  renderTabs();
}

function getTab(id){ return tabs.find(t=>t.id===id)||null; }

function closeTab(id){
  const idx = tabs.findIndex(t=>t.id===id);
  if(idx===-1) return;
  const tab = tabs[idx];
  tab.pane.remove();
  tabs.splice(idx,1);
  if(!tabs.length){ mkTab(); return; }
  if(activeId===id){
    activeId=null;
    activateTab(tabs[Math.min(idx,tabs.length-1)].id);
  }
  renderTabs();
}

function renderTabs(){
  const bar = $id('tab-bar');
  const plusBtn = $id('plus-tab');
  // remove old tab elements only
  bar.querySelectorAll('.tab').forEach(el=>el.remove());
  tabs.forEach(tab=>{
    const el=document.createElement('div');
    el.className='tab'+(tab.id===activeId?' active':'');
    el.dataset.tid=tab.id;
    el.innerHTML=`<span class="tab-icon">${tab.favicon}</span><span class="tab-lbl">${esc(tab.title)}</span><span class="tab-x" data-close="${tab.id}">×</span>`;
    bar.insertBefore(el, plusBtn);
  });
}

// ═══════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════
function parseDomain(url){
  return (url||'').replace(/^https?:\/\//i,'').replace(/^dogweb:\/\//i,'')
    .split('/')[0].split('?')[0].replace(/\.dog$/,'').toLowerCase().trim();
}
function parseQuery(url){
  const m=(url||'').match(/[?&]q=([^&]*)/);
  return m?decodeURIComponent(m[1]):'';
}

function navTo(url){
  if(!activeId) return;
  loadURL(activeId, url, true);
}

function loadURL(tabId, url, push){
  const tab=getTab(tabId);
  if(!tab) return;
  if(push && tab.url!==url){ tab.back.push(tab.url); tab.fwd=[]; }
  tab.url=url;
  if(tabId===activeId){
    $id('abar').value=(url==='dogweb://newtab'||!url)?'':url;
    $id('status-msg').textContent=url||'New Tab';
  }
  tab.pane.innerHTML=''; // clear old content
  if(!url||url==='dogweb://newtab'){
    tab.title='New Tab'; tab.favicon='🐾';
    buildNewTab(tab);
  } else {
    const domain=parseDomain(url);
    const query=parseQuery(url);
    if(BUILTINS[domain]){
      tab.title=BUILTINS[domain].title; tab.favicon=BUILTINS[domain].favicon;
      buildBuiltin(tab, domain, query);
    } else {
      resolveUserSite(tab, domain);
    }
  }
  renderTabs();
}

async function resolveUserSite(tab, domain){
  // Check local cache first (works even offline)
  let site = (sites[domain] && sites[domain].published) ? sites[domain] : null;
  // If not in local cache, try Firestore
  if(!site){
    try{
      const doc=await FS.collection('dogweb_sites').doc(domain).get();
      if(doc.exists && doc.data().published) site=doc.data();
    } catch(e){ /* ignore - will show not found */ }
  }
  if(site){
    tab.title=site.title||domain; tab.favicon=site.favicon||'🌐';
    buildUserSite(tab, site);
  } else {
    tab.title='Not Found'; tab.favicon='❓';
    buildNotFound(tab, domain);
  }
  renderTabs();
}

function goBack(){
  const t=getTab(activeId);
  if(!t||!t.back.length) return;
  t.fwd.push(t.url);
  loadURL(activeId, t.back.pop(), false);
}
function goFwd(){
  const t=getTab(activeId);
  if(!t||!t.fwd.length) return;
  t.back.push(t.url);
  loadURL(activeId, t.fwd.pop(), false);
}
function reload(){ const t=getTab(activeId); if(t) loadURL(activeId,t.url,false); }
function goHome(){ navTo('dogweb://newtab'); }

function navigate(){
  let v=$id('abar').value.trim();
  if(!v){ navTo('dogweb://newtab'); return; }
  if(!v.includes('.dog')&&!v.includes('://')){
    v='doggle.dog?q='+encodeURIComponent(v);
  }
  navTo(v);
}

function buildBuiltin(tab, domain, query){
  const wrap=document.createElement('div');
  wrap.className='bp';
  tab.pane.appendChild(wrap);
  if(domain==='doggle') buildSearch(wrap, query);
  else if(domain==='sites') buildAllSites(wrap);
}

async function buildSearch(wrap, query){
  const div=document.createElement('div');
  div.className='srp';
  wrap.appendChild(div);

  // Always start with builtins + any locally known published sites
  const localPublished = Object.entries(sites)
    .filter(([,s])=>s.published)
    .reduce((acc,[d,s])=>{ acc[d]=s; return acc; },{});

  // Try to also fetch from Firestore (may fail if not logged in / rules block it)
  let fsPublished={};
  try{
    const snap=await FS.collection('dogweb_sites').where('published','==',true).get();
    snap.forEach(doc=>{ fsPublished[doc.id]=doc.data(); });
  } catch(e){ /* offline or rules blocked — use local only */ }

  // Merge: Firestore wins over local for same domain
  const allPublished = Object.assign({}, localPublished, fsPublished);

  const q=(query||'').toLowerCase();
  const all=[
    {domain:'doggle', title:'Doggle Search',    favicon:'🔍', desc:'The #1 search engine on DogWeb.'},
    {domain:'sites',  title:'All DogWeb Sites',  favicon:'📋', desc:'Browse every published site on the .dog internet.'},
    ...Object.entries(allPublished).map(([d,s])=>({domain:d,title:s.title||d,favicon:s.favicon||'🌐',desc:'A user-built site on DogWeb'}))
  ];
  const results = q ? all.filter(r=>(r.title+r.domain+r.desc).toLowerCase().includes(q)) : all;

  let h=`<div class="srp-hdr"><span>🔍</span><div><h2>${esc(query)||'DogWeb Search'}</h2><small>${results.length} result${results.length!==1?'s':''}</small></div></div>`;
  if(!results.length){
    h+=`<div class="no-res"><div class="ni">🐕</div><p>No results for "<strong>${esc(query)}</strong>".<br>Try building it yourself!</p></div>`;
  } else {
    results.forEach(r=>{
      h+=`<div class="rc" data-url="${esc(r.domain)}.dog"><div class="rc-dom">${r.favicon} ${esc(r.domain)}.dog</div><div class="rc-ttl">${esc(r.title)}</div><div class="rc-dsc">${esc(r.desc)}</div></div>`;
    });
  }
  div.innerHTML=h;
  div.querySelectorAll('.rc[data-url]').forEach(el=>{
    el.addEventListener('click',()=>navTo(el.dataset.url));
  });
}

async function buildAllSites(wrap){
  const div=document.createElement('div');
  div.className='asp';
  const grid=document.createElement('div');
  grid.className='sgrid';
  div.innerHTML='<h2>📋 All Sites on DogWeb</h2>';
  div.appendChild(grid);
  wrap.appendChild(div);

  // Builtin sites always show
  [['doggle','Doggle','🔍'],['sites','All Sites','📋']].forEach(([d,t,f])=>{
    const c=document.createElement('div'); c.className='sgc';
    c.innerHTML=`<div class="sgc-icon">${f}</div><div class="sgc-name">${t}</div><div class="sgc-dom">${d}.dog</div>`;
    c.addEventListener('click',()=>navTo(d+'.dog'));
    grid.appendChild(c);
  });

  // Collect published sites: local cache first, then Firestore
  const allPublished = Object.assign(
    {},
    // local
    Object.entries(sites).filter(([,s])=>s.published).reduce((a,[d,s])=>{ a[d]=s; return a; },{}),
  );

  // Try Firestore too
  try{
    const snap=await FS.collection('dogweb_sites').where('published','==',true).get();
    snap.forEach(doc=>{ allPublished[doc.id]=doc.data(); });
  } catch(e){ /* use local only */ }

  const userSites = Object.entries(allPublished);
  if(userSites.length===0){
    const empty=document.createElement('div'); empty.className='sgc';
    empty.style.cssText='border:2px dashed #D4AA7D;cursor:pointer;';
    empty.innerHTML='<div class="sgc-icon">➕</div><div class="sgc-name">Build a site!</div><div class="sgc-dom">yours.dog</div>';
    empty.addEventListener('click', openDev);
    grid.appendChild(empty);
  } else {
    userSites.forEach(([domain,s])=>{
      const c=document.createElement('div'); c.className='sgc';
      c.innerHTML=`<div class="sgc-icon">${s.favicon||'🌐'}</div><div class="sgc-name">${esc(s.title||domain)}</div><div class="sgc-dom">${esc(domain)}.dog</div>`;
      c.addEventListener('click',()=>navTo(domain+'.dog'));
      grid.appendChild(c);
    });
  }
}



function buildUserSite(tab, site){
  const htmlFile = (site.files||{})['index.html'] || Object.values(site.files||{}).find(f=>f.type==='html');
  if(!htmlFile){ buildNotFound(tab, tab.url); return; }
  let html = htmlFile.content||'';
  let styles='', scripts='';
  Object.entries(site.files||{}).forEach(([n,f])=>{
    if(f.type==='css') styles  +=`<style>/* ${n} */\n${f.content||''}\n</style>\n`;
    if(f.type==='js')  scripts +=`<script>/* ${n} */\n${f.content||''}\n<\/script>\n`;
  });
  if(html.includes('</head>')) html=html.replace('</head>',styles+'</head>');
  else html=styles+html;
  if(html.includes('</body>')) html=html.replace('</body>',scripts+'</body>');
  else html=html+scripts;
  const ifr=document.createElement('iframe');
  ifr.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:none;display:block;';
  tab.pane.appendChild(ifr);
  try{
    const doc=ifr.contentDocument||ifr.contentWindow.document;
    doc.open('text/html','replace');
    doc.write(html);
    doc.close();
  } catch(e){ console.error('iframe write:',e); }
}

function buildNotFound(tab, domain){
  const d=document.createElement('div'); d.className='nfw';
  d.innerHTML=`<div class="nfb"><span class="nf-icon">🐕</span><h2>Can't fetch that page!</h2><p><strong>${esc(domain)}.dog</strong> doesn't exist or hasn't been published yet.</p><button class="nf-btn" id="__nf_home">🏠 Home</button><button class="nf-btn dk" id="__nf_dev">⚙️ Build It</button></div>`;
  tab.pane.appendChild(d);
  d.querySelector('#__nf_home').addEventListener('click', goHome);
  d.querySelector('#__nf_dev').addEventListener('click', openDev);
}

  }
  el.innerHTML=entries.map(([d,s])=>
    `<div class="sli${d===curDomain?' on':''}" data-dom="${esc(d)}">
      <span>${s.favicon||'🌐'}</span>
      <span style="overflow:hidden;text-overflow:ellipsis;">${esc(s.title||d)}</span>
      ${s.published?'<span class="pdot">●</span>':''}
    </div>`).join('');
  el.querySelectorAll('.sli[data-dom]').forEach(el2=>{
    el2.addEventListener('click',()=>selectSite(el2.dataset.dom));
  });
}

function selectSite(domain){
  curDomain=domain; curFile=null; prevOpen=false;
  $id('prev-frame').classList.remove('on');
  $id('dea').style.display='flex';
  $id('btn-preview').textContent='▶ Preview';
  const s=sites[domain]; if(!s) return;
  $id('cur-dom').textContent=domain+'.dog';
  $id('fav-in').value=s.favicon||'';
  $id('ttl-in').value=s.title||'';
  renderFileTabs();
  const first=Object.keys(s.files||{})[0];
  if(first) selectFile(first);
  renderSiteList();
}

function renderFileTabs(){
  if(!curDomain||!sites[curDomain]) return;
  const bar=$id('file-tabs');
  bar.innerHTML='';
  Object.keys(sites[curDomain].files||{}).forEach(fname=>{
    const el=document.createElement('div');
    el.className='ftab'+(fname===curFile?' on':'');
    el.innerHTML=`<span>${esc(fname)}</span><span class="fx" data-del="${esc(fname)}">×</span>`;
    el.addEventListener('click',function(e){
      const del=e.target.dataset.del;
      if(del) doRemoveFile(del,e);
      else selectFile(fname);
    });
    bar.appendChild(el);
  });
  const addBtn=document.createElement('button');
  addBtn.id='add-file'; addBtn.textContent='+'; addBtn.title='New file';
  addBtn.addEventListener('click', doAddFile);
  bar.appendChild(addBtn);
}

function selectFile(fname){
  if(!curDomain) return;
  flushEditor();
  curFile=fname;
  const f=(sites[curDomain].files||{})[fname];
  if(!f) return;
  $id('editor').value=f.content||'';
  $id('ftype').value=f.type||guessType(fname);
  renderFileTabs();
}

function flushEditor(){
  if(!curDomain||!curFile) return;
  const c=$id('editor').value;
  if(sites[curDomain]&&sites[curDomain].files&&sites[curDomain].files[curFile]){
    sites[curDomain].files[curFile].content=c;
  }
}

function doSave(){ flushEditor(); saveSite(curDomain); toast('💾 Saved '+curFile); }

function doAddFile(){
  if(!curDomain){ toast('Select a site first!'); return; }
  const name=prompt('File name (e.g. about.html, style.css, app.js):');
  if(!name||!name.trim()) return;
  const fname=name.trim();
  if(!sites[curDomain].files) sites[curDomain].files={};
  sites[curDomain].files[fname]={ content:fileTemplate(fname,guessType(fname)), type:guessType(fname) };
  saveSite(curDomain);
  selectSite(curDomain); selectFile(fname);
}

function doRemoveFile(fname, e){
  if(e){ e.stopPropagation(); e.preventDefault(); }
  if(!curDomain) return;
  const files=sites[curDomain].files||{};
  if(Object.keys(files).length<=1){ toast('Need at least one file!'); return; }
  if(!confirm('Delete '+fname+'?')) return;
  delete files[fname];
  saveSite(curDomain);
  curFile=null; selectSite(curDomain);
  const rem=Object.keys(files);
  if(rem.length) selectFile(rem[0]);
}

async function doPublish(){
  if(!curDomain){ toast('Select a site first!'); return; }
  flushEditor();
  sites[curDomain].published=true;
  await saveSite(curDomain);
  toast('🚀 '+curDomain+'.dog is live!');
  renderSiteList();
}

async function doLaunch(){
  await doPublish();
  closeDev();
  navTo(curDomain+'.dog');
}

async function doDeleteSite(){
  if(!curDomain) return;
  if(!confirm('Delete '+curDomain+'.dog? Cannot be undone.')) return;
  await deleteSiteFS(curDomain);
  delete sites[curDomain];
  curDomain=null; curFile=null;
  renderSiteList();
  $id('cur-dom').textContent='—';
  $id('editor').value='';
  $id('file-tabs').innerHTML='<button id="add-file">+</button>';
  $id('add-file').addEventListener('click', doAddFile);
  toast('🗑 Deleted');
}

function doTogglePreview(){
  if(!curDomain){ toast('Select a site first!'); return; }
  prevOpen=!prevOpen;
  const pf=$id('prev-frame');
  const dea=$id('dea');
  const btn=$id('btn-preview');
  if(prevOpen){
    flushEditor();
    const site=sites[curDomain];
    const htmlFile=(site.files||{})['index.html']||Object.values(site.files||{}).find(f=>f.type==='html');
    if(!htmlFile){ toast('No HTML file!'); prevOpen=false; return; }
    let html=htmlFile.content||'';
    let st='', userJs='';
    Object.entries(site.files||{}).forEach(([n,f])=>{
      if(f.type==='css') st    +=`<style>/* ${n} */\n${f.content||''}\n</style>\n`;
      if(f.type==='js')  userJs+=`<script>/* ${n} */\n${f.content||''}\n<\/script>\n`;
    });
    if(html.includes('</head>')) html=html.replace('</head>',st+'</head>'); else html=st+html;
    if(html.includes('</body>')) html=html.replace('</body>',userJs+'</body>'); else html=html+userJs;
    dea.style.display='none'; pf.classList.add('on');
    try{ const doc=pf.contentDocument||pf.contentWindow.document; doc.open('text/html','replace'); doc.write(html); doc.close(); }
    catch(e){ console.error(e); }
    btn.textContent='\u270F\uFE0F Editor';
  } else {
    dea.style.display='flex'; pf.classList.remove('on');
    btn.textContent='\u25B6 Preview';
  }
}

// ═══════════════════════════════════════════════════════════
// NEW SITE MODAL
// ═══════════════════════════════════════════════════════════
function openNS(){
  $id('ns-dom').value=''; $id('ns-ttl').value=''; $id('ns-ico').value='';
  $id('ns-modal').classList.add('open');
}
function closeNS(){ $id('ns-modal').classList.remove('open'); }

async function doCreateSite(){
  const domain=$id('ns-dom').value.trim().toLowerCase().replace(/[^a-z0-9\-]/g,'');
  const title=$id('ns-ttl').value.trim()||domain;
  const favicon=$id('ns-ico').value.trim()||'🌐';
  const tpl=$id('ns-tpl').value;
  if(!domain||domain.length<2){ toast('Enter a valid domain!'); return; }
  if(sites[domain]||BUILTINS[domain]){ toast('Domain already taken!'); return; }
  try{
    const doc=await FS.collection('dogweb_sites').doc(domain).get();
    if(doc.exists){ toast('Domain taken by another user!'); return; }
  } catch(e){}
  sites[domain]={ title, favicon, files:getTemplate(domain,title,favicon,tpl), published:false, owner:me.username };
  await saveSite(domain);
  closeNS();
  renderSiteList();
  selectSite(domain);
  toast('🎉 '+domain+'.dog created!');
}

// ═══════════════════════════════════════════════════════════
// TEMPLATES
// ═══════════════════════════════════════════════════════════
function guessType(n){ if(n.endsWith('.css'))return'css'; if(n.endsWith('.js'))return'js'; return'html'; }

function fileTemplate(fname,type){
  if(type==='css') return `/* ${fname} */\nbody {\n  font-family: sans-serif;\n  margin: 0;\n  padding: 20px;\n}\n`;
  if(type==='js')  return `/* ${fname} */\nconsole.log('🐾 Loaded!');\n`;
  return `<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <title>Page</title>\n</head>\n<body>\n  <h1>Hello!</h1>\n</body>\n</html>`;
}

function getTemplate(domain,title,favicon,tpl){
  const T=(t,c)=>({type:t,content:c});
  switch(tpl){
    case'hello':return{
      'index.html':T('html',`<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8"><title>${title}</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>${favicon} ${title}</h1>\n  <p>Welcome to ${domain}.dog! 🐾</p>\n  <script src="app.js"><\/script>\n</body>\n</html>`),
      'style.css':T('css',`body{font-family:'Segoe UI',sans-serif;background:#FFF8F0;text-align:center;padding:60px;}\nh1{font-size:48px;color:#8B4513;}\np{color:#6A5040;font-size:18px;}\n`),
      'app.js':T('js',`console.log('🐾 ${title} ready!');\n`)
    };
    case'landing':return{
      'index.html':T('html',`<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8"><title>${title}</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <nav><span class="logo">${favicon} ${title}</span><a href="#about">About</a></nav>\n  <section class="hero"><h1>Welcome to <span>${title}</span></h1><p>Your awesome site on DogWeb 🐾</p><button onclick="alert('Woof! 🐶')">Get Started</button></section>\n  <section id="about" class="about"><h2>About</h2><p>Built with DogWeb Dev Tools!</p></section>\n  <script src="app.js"><\/script>\n</body>\n</html>`),
      'style.css':T('css',`*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:#FFF8F0}nav{background:#8B4513;color:white;padding:14px 30px;display:flex;gap:20px;align-items:center}.logo{font-size:20px;font-weight:800;flex:1}nav a{color:rgba(255,255,255,.85);text-decoration:none;font-weight:600}.hero{padding:80px 30px;text-align:center;background:linear-gradient(135deg,#FFF0DC,#FFD4A0)}.hero h1{font-size:48px;color:#2C1810;margin-bottom:14px}.hero h1 span{color:#8B4513}.hero p{font-size:18px;color:#6A5040;margin-bottom:26px}.hero button{background:#F4A340;border:none;border-radius:30px;padding:14px 32px;font-size:16px;font-weight:800;color:white;cursor:pointer}.about{padding:60px 30px;text-align:center}.about h2{font-size:32px;color:#5C3317;margin-bottom:9px}\n`),
      'app.js':T('js',`console.log('🐾 ${title} ready!');\n`)
    };



    default:return{
      'index.html':T('html',`<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width,initial-scale=1.0">\n  <title>${title}</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>${favicon} ${title}</h1>\n  <p>Your site on DogWeb 🐾</p>\n  <script src="app.js"><\/script>\n</body>\n</html>`),
      'style.css':T('css',`body{font-family:sans-serif;background:#FFF8F0;color:#2C1810;padding:40px;}\nh1{color:#8B4513;}\n`),
      'app.js':T('js',`console.log('🐾 ${title} loaded!');\n`)
    };
  }
}

// ═══════════════════════════════════════════════════════════
// WIRE ALL BUTTONS  (done once, after DOM is ready)
// ═══════════════════════════════════════════════════════════
function wireButtons(){
  // Title bar
  $id('user-pill').addEventListener('click',()=>{
    if(me){ if(confirm('Sign out of @'+me.username+'?')){ me=null; sessionStorage.removeItem('dw_sess'); sites={}; refreshUserUI(); renderSiteList(); toast('👋 Signed out'); } }
    else openAuth('login');
  });

  // Auth modal
  $id('tab-login').addEventListener('click',()=>switchAuthMode('login'));
  $id('tab-signup').addEventListener('click',()=>switchAuthMode('signup'));
  $id('auth-ok').addEventListener('click', doAuth);
  $id('ap').addEventListener('keydown',e=>{ if(e.key==='Enter') doAuth(); });
  $id('au').addEventListener('input',()=>{ $id('au').value=$id('au').value.toLowerCase().replace(/[^a-z0-9_]/g,''); });

  // Tab bar
  $id('plus-tab').addEventListener('click',()=>mkTab());
  $id('tab-bar').addEventListener('click',function(e){
    const closeId=e.target.dataset.close;
    if(closeId){ closeTab(closeId); return; }
    const tabEl=e.target.closest('.tab');
    if(tabEl&&tabEl.dataset.tid) activateTab(tabEl.dataset.tid);
  });

  // Toolbar
  $id('btn-back').addEventListener('click', goBack);
  $id('btn-fwd').addEventListener('click', goFwd);
  $id('btn-reload').addEventListener('click', reload);
  $id('btn-home').addEventListener('click', goHome);
  $id('go-btn').addEventListener('click', navigate);
  $id('abar').addEventListener('keydown',e=>{ if(e.key==='Enter') navigate(); });
  $id('dev-btn').addEventListener('click', openDev);

  // Dev modal
  $id('dev-close-btn').addEventListener('click', closeDev);
  $id('btn-newsitemodal').addEventListener('click', openNS);
  $id('btn-preview').addEventListener('click', doTogglePreview);
  $id('btn-publish').addEventListener('click', doPublish);
  $id('btn-launch').addEventListener('click', doLaunch);
  $id('btn-delsite').addEventListener('click', doDeleteSite);
  $id('btn-save').addEventListener('click', doSave);
  $id('fav-in').addEventListener('input',()=>{ if(curDomain){ sites[curDomain].favicon=$id('fav-in').value; renderSiteList(); } });
  $id('ttl-in').addEventListener('input',()=>{ if(curDomain){ sites[curDomain].title=$id('ttl-in').value; renderSiteList(); } });
  $id('ftype').addEventListener('change',()=>{ if(curDomain&&curFile) sites[curDomain].files[curFile].type=$id('ftype').value; });
  $id('add-file').addEventListener('click', doAddFile);

  // New site modal
  $id('ns-cancel').addEventListener('click', closeNS);
  $id('ns-create').addEventListener('click', doCreateSite);
  $id('ns-dom').addEventListener('input',()=>{ $id('ns-dom').value=$id('ns-dom').value.toLowerCase().replace(/[^a-z0-9\-]/g,''); });

  // Close modals on backdrop click
  $id('auth-modal').addEventListener('click',e=>{ if(e.target===$id('auth-modal')) closeAuth(); });
  $id('dev-modal').addEventListener('click',e=>{ if(e.target===$id('dev-modal')) closeDev(); });
  $id('ns-modal').addEventListener('click',e=>{ if(e.target===$id('ns-modal')) closeNS(); });
}

// ═══════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════
wireButtons();
restoreSession();
mkTab('dogweb://newtab','New Tab','🐾');
if(me) loadMySites();
</script>
